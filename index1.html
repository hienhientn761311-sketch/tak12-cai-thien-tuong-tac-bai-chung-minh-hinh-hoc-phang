<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thi thử: △AOD = △COB - TAK12</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #0f1117;
            color: #e8e8f0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .widget-container { width: 100%; max-width: 1100px; }

        /* Header */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            gap: 16px;
        }
        .top-bar-left h2 { font-size: 1.35rem; font-weight: 700; margin-bottom: 4px; }
        .top-bar-left p  { color: #6b7280; font-size: .85rem; }
        .badge-exam {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.35);
            color: #f87171;
            font-size: 0.7rem; font-weight: 700;
            letter-spacing: .1em; text-transform: uppercase;
            padding: 5px 12px; border-radius: 20px; white-space: nowrap;
            margin-bottom: 12px;
        }
        .badge-exam::before { content: '●'; font-size: 8px; }

        .given-strip {
            background: #16181f;
            border: 1px solid #2a2d3a;
            border-left: 3px solid #4f6ef7;
            border-radius: 8px;
            padding: 11px 18px;
            margin-bottom: 20px;
            font-size: .875rem; color: #a8b3cf;
            display: flex; gap: 10px; align-items: flex-start;
        }
        .given-strip .lbl {
            color: #4f6ef7; font-weight: 600; white-space: nowrap;
            font-size: .72rem; text-transform: uppercase;
            letter-spacing: .08em; padding-top: 2px;
        }

        /* Main layout */
        .main-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        /* Figure */
        .figure-panel {
            flex: 0 0 260px;
            background: #16181f;
            border: 1px solid #2a2d3a;
            border-radius: 12px;
            padding: 20px 12px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .figure-svg { width: 100%; max-width: 220px; }

        /* Tree */
        .tree-wrap {
            flex: 1;
            background: #16181f;
            border: 1px solid #2a2d3a;
            border-radius: 12px;
            padding: 24px 16px 20px;
        }
        .tree-wrap svg { width: 100%; display: block; }

        /* SVG box types */
        .static-rect  { fill: #1e2130; stroke: #2a2d3a; stroke-width: .8; }
        .static-lbl   { fill: #52c41a; font-size: 9.5px; font-weight: 600; }
        .static-txt   { fill: #7a85a8; font-size: 11px; }
        .concl-rect   { fill: #1a2a1a; stroke: #5fbd18; stroke-width: 1; }
        .concl-txt    { fill: #5fbd18; font-size: 13px; font-weight: 600; }
        .conn         { stroke: #2a2d3a; stroke-width: .8; fill: none; }
        .conn-green   { stroke: #5fbd18; stroke-width: .8; fill: none; }

        /* Clickable slot */
        .slot { cursor: pointer; transition: opacity .15s; }
        .slot:hover .slot-bg { stroke: #6b7280 !important; }
        .slot-bg {
            fill: #1e2130;
            stroke: #3a3f5a;
            stroke-width: .8;
            stroke-dasharray: 4 3;
            transition: fill .15s, stroke .15s;
        }
        .slot.selected .slot-bg  { fill: rgba(79,110,247,0.12); stroke: #4f6ef7; stroke-dasharray: none; }
        .slot.answered .slot-bg  { fill: #1e2130; stroke: #52525b; stroke-dasharray: none; }
        .slot.correct  .slot-bg  { fill: rgba(95,189,24,0.12);  stroke: #5fbd18; stroke-dasharray: none; }
        .slot.wrong    .slot-bg  { fill: rgba(239,68,68,0.10);  stroke: #ef4444; stroke-dasharray: none; }

        .slot-tag  { fill: #3a3f5a; font-size: 9.5px; font-weight: 600; letter-spacing:.06em; }
        .slot-ph   { fill: #40445a; font-size: 10.5px; }
        .slot.selected  .slot-ph { fill: #4f6ef7; }
        .slot.answered  .slot-ph { fill: #c0c8e0; font-size: 11.5px; }
        .slot.correct   .slot-ph { fill: #5fbd18; font-size: 11.5px; }
        .slot.wrong     .slot-ph { fill: #ef4444; font-size: 11.5px; }

        /* Popup card picker */
        .picker-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .picker-overlay.open { display: flex; }
        .picker-box {
            background: #1e2130;
            border: 1px solid #3a3f5a;
            border-radius: 12px;
            padding: 24px;
            width: 360px;
            max-width: 92vw;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            animation: popIn .18s ease;
        }
        @keyframes popIn { from{opacity:0;transform:scale(.95)} to{opacity:1;transform:scale(1)} }
        .picker-title {
            font-size: .8rem; font-weight: 600; color: #6b7280;
            letter-spacing: .08em; text-transform: uppercase;
            margin-bottom: 14px;
        }
        .picker-cards { display: flex; flex-direction: column; gap: 8px; }
        .picker-card {
            background: #16181f;
            border: 1px solid #2a2d3a;
            border-radius: 7px;
            padding: 11px 16px;
            cursor: pointer;
            font-size: .88rem; color: #c0c8e0;
            transition: all .15s;
        }
        .picker-card:hover { background: #252838; border-color: #4f6ef7; color: #e8e8f0; }
        .picker-cancel {
            margin-top: 12px; width: 100%;
            background: transparent; border: 1px solid #2a2d3a;
            border-radius: 7px; padding: 9px;
            color: #52525b; font-size: .82rem; cursor: pointer;
            transition: all .15s; font-family: inherit;
        }
        .picker-cancel:hover { border-color: #3a3f5a; color: #6b7280; }

        /* Submit bar */
        .submit-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 20px;
            background: #16181f;
            border: 1px solid #2a2d3a;
            border-radius: 10px;
            margin-bottom: 16px;
        }
        .submit-status { font-size: .875rem; color: #6b7280; }
        .submit-status span { color: #4f6ef7; font-weight: 600; }
        .btn-submit {
            background: #4f6ef7; border: none;
            color: #fff; font-weight: 700; font-size: .9rem;
            padding: 10px 28px; border-radius: 7px;
            cursor: pointer; font-family: inherit;
            transition: background .15s, opacity .15s;
            opacity: .4; pointer-events: none;
        }
        .btn-submit.ready { opacity: 1; pointer-events: auto; }
        .btn-submit.ready:hover { background: #3d5ce0; }

        /* Result banner */
        .result-banner {
            display: none;
            border-radius: 10px; padding: 16px 20px; text-align: center;
            animation: fadeIn .4s ease;
        }
        .result-banner.show { display: block; }
        .result-banner.all-correct {
            background: rgba(95,189,24,0.1); border: 1px solid rgba(95,189,24,0.3);
        }
        .result-banner.has-wrong {
            background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25);
        }
        .result-banner p { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
        .result-banner.all-correct p { color: #5fbd18; }
        .result-banner.has-wrong  p { color: #f87171; }
        .result-banner span { font-size: .82rem; color: #6b7280; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }

        @media (max-width: 680px) {
            .main-layout { flex-direction: column; }
            .figure-panel { flex: none; width: 100%; }
        }
    </style>
</head>
<body>
<div class="widget-container">

    <div class="top-bar">
        <div class="top-bar-left">
            <div class="badge-exam">Chế độ thi thử</div>
            <h2>Chứng minh: △AOD = △COB</h2>
            <p>Nhấn vào ô trống để chọn mệnh đề. Điền xong tất cả rồi nhấn Nộp bài.</p>
        </div>
    </div>

    <div class="given-strip">
        <span class="lbl">Giả thiết</span>
        <span>Cho hình vẽ, O là giao điểm của AC và BD. Biết AO = CO, OD = OB. Chứng minh △AOD = △COB.</span>
    </div>

    <div class="main-layout">

        <!-- Hình vẽ -->
        <div class="figure-panel">
            <svg class="figure-svg" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
                <line x1="60"  y1="30"  x2="160" y2="190" stroke="#d4d4d8" stroke-width="1.5"/>
                <line x1="190" y1="40"  x2="28"  y2="178" stroke="#d4d4d8" stroke-width="1.5"/>
                <line x1="60"  y1="30"  x2="28"  y2="178" stroke="#d4d4d8" stroke-width="1.5"/>
                <line x1="160" y1="190" x2="190" y2="40"  stroke="#d4d4d8" stroke-width="1.5"/>
                <text x="55"  y="22"  text-anchor="middle" fill="#e4e4e7" font-size="13" font-family="sans-serif">A</text>
                <text x="200" y="38"  text-anchor="middle" fill="#e4e4e7" font-size="13" font-family="sans-serif">B</text>
                <text x="165" y="204" text-anchor="middle" fill="#e4e4e7" font-size="13" font-family="sans-serif">C</text>
                <text x="20"  y="185" text-anchor="middle" fill="#e4e4e7" font-size="13" font-family="sans-serif">D</text>
                <text x="103" y="104" text-anchor="end"    fill="#e4e4e7" font-size="12" font-family="sans-serif">O</text>
                <!-- gạch đơn AO = CO -->
                <line x1="80"  y1="72"  x2="88"  y2="66"  stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
                <line x1="130" y1="152" x2="138" y2="146" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
                <!-- gạch đôi OD = OB -->
                <line x1="65"  y1="141" x2="71"  y2="148" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
                <line x1="61"  y1="137" x2="67"  y2="144" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
                <line x1="147" y1="71"  x2="153" y2="78"  stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
                <line x1="143" y1="67"  x2="149" y2="74"  stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
                <circle cx="109" cy="109" r="2.5" fill="#d4d4d8"/>
            </svg>
        </div>

        <!-- Sơ đồ logic (vẽ sẵn toàn bộ, 2 ô trống) -->
        <div class="tree-wrap">
            <svg viewBox="0 0 740 310">
                <defs>
                    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                        <path d="M2 1L8 5L2 9" fill="none" stroke="#3a3f5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </marker>
                    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                        <path d="M2 1L8 5L2 9" fill="none" stroke="#5fbd18" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </marker>
                </defs>

                <!-- 3 mũi tên hội tụ lên kết luận (luôn hiển thị) -->
                <line x1="130" y1="198" x2="295" y2="138" class="conn-green" marker-end="url(#arr-g)"/>
                <line x1="370" y1="198" x2="370" y2="138" class="conn-green" marker-end="url(#arr-g)"/>
                <line x1="610" y1="198" x2="445" y2="138" class="conn-green" marker-end="url(#arr-g)"/>

                <!-- TẦNG TRÊN: Kết luận (luôn hiển thị) -->
                <rect x="160" y="60" width="420" height="62" rx="8" class="concl-rect"/>
                <text x="370" y="86"  text-anchor="middle" class="concl-txt">△AOD = △COB (c.g.c)</text>
                <text x="370" y="108" text-anchor="middle" style="fill:#4b7a14;font-size:11px;">Cần chứng minh</text>

                <!-- Nhánh TRÁI — slot bước 1: AO = CO -->
                <g id="slot-ao" class="slot" onclick="openPicker('slot-ao')">
                    <rect class="slot-bg" x="30" y="198" width="200" height="60" rx="6"/>
                    <text class="slot-tag" x="42"  y="216">BƯỚC 1</text>
                    <text class="slot-ph"  id="ph-ao" x="130" y="234" text-anchor="middle">Nhấn để chọn…</text>
                </g>

                <!-- Nhánh GIỮA — tĩnh -->
                <rect x="270" y="198" width="200" height="60" rx="6" class="static-rect"/>
                <text x="370" y="217" text-anchor="middle" class="static-lbl">Góc đối đỉnh</text>
                <text x="370" y="238" text-anchor="middle" class="static-txt">∠AOD = ∠COB</text>

                <!-- Nhánh PHẢI — slot bước 2: OD = OB -->
                <g id="slot-od" class="slot" onclick="openPicker('slot-od')">
                    <rect class="slot-bg" x="510" y="198" width="200" height="60" rx="6"/>
                    <text class="slot-tag" x="522" y="216">BƯỚC 2</text>
                    <text class="slot-ph"  id="ph-od" x="610" y="234" text-anchor="middle">Nhấn để chọn…</text>
                </g>

            </svg>
        </div>
    </div>

    <!-- Submit bar -->
    <div class="submit-bar">
        <p class="submit-status">Đã điền: <span id="filled-count">0</span> / 2 ô</p>
        <button class="btn-submit" id="btn-submit" onclick="submitAnswers()">Nộp bài</button>
    </div>

    <!-- Result -->
    <div class="result-banner" id="result-banner">
        <p id="result-title"></p>
        <span id="result-desc"></span>
    </div>

</div>

<!-- Picker overlay -->
<div class="picker-overlay" id="picker-overlay" onclick="closePickerOnOverlay(event)">
    <div class="picker-box">
        <p class="picker-title" id="picker-title">Chọn mệnh đề</p>
        <div class="picker-cards" id="picker-cards"></div>
        <button class="picker-cancel" onclick="closePicker()">Huỷ</button>
    </div>
</div>

<script>
    // ── Data ──────────────────────────────────────────────────────
    const SLOTS = {
        'slot-ao': { correct: 'AO = CO',  label: 'BƯỚC 1', answer: null },
        'slot-od': { correct: 'OD = OB',  label: 'BƯỚC 2', answer: null },
    };

    // Mỗi slot có ngân hàng thẻ riêng (đúng + nhiễu)
    const CARDS = {
        'slot-ao': ['AO = CO', 'AO = OB', '∠OAD = ∠OCB', 'OD = OB'],
        'slot-od': ['OD = OB', 'CO = OB', 'AO = CO',      '∠AOD = ∠COB'],
    };

    let currentSlot = null;
    let submitted   = false;

    // ── Mở picker ─────────────────────────────────────────────────
    function openPicker(slotId) {
        if (submitted) return;
        currentSlot = slotId;

        // Highlight slot đang chọn
        document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
        const el = document.getElementById(slotId);
        if (!el.classList.contains('answered')) el.classList.add('selected');

        // Build cards — shuffle
        const cards = [...CARDS[slotId]].sort(() => Math.random() - .5);
        const container = document.getElementById('picker-cards');
        container.innerHTML = '';
        cards.forEach(c => {
            const div = document.createElement('div');
            div.className = 'picker-card';
            div.textContent = c;
            div.onclick = () => selectCard(c);
            container.appendChild(div);
        });

        document.getElementById('picker-title').textContent =
            'Chọn mệnh đề cho ' + SLOTS[slotId].label;
        document.getElementById('picker-overlay').classList.add('open');
    }

    // ── Chọn thẻ ──────────────────────────────────────────────────
    function selectCard(value) {
        SLOTS[currentSlot].answer = value;

        // Cập nhật text trong SVG
        const phId = currentSlot === 'slot-ao' ? 'ph-ao' : 'ph-od';
        document.getElementById(phId).textContent = value;

        // Đổi trạng thái slot
        const el = document.getElementById(currentSlot);
        el.classList.remove('selected');
        el.classList.add('answered');

        closePicker();
        updateSubmitBar();
    }

    // ── Đóng picker ───────────────────────────────────────────────
    function closePicker() {
        document.getElementById('picker-overlay').classList.remove('open');
        document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
        currentSlot = null;
    }
    function closePickerOnOverlay(e) {
        if (e.target === document.getElementById('picker-overlay')) closePicker();
    }

    // ── Cập nhật nút submit ───────────────────────────────────────
    function updateSubmitBar() {
        const filled = Object.values(SLOTS).filter(s => s.answer !== null).length;
        document.getElementById('filled-count').textContent = filled;
        const btn = document.getElementById('btn-submit');
        if (filled === 2) btn.classList.add('ready');
        else              btn.classList.remove('ready');
    }

    // ── Nộp bài ───────────────────────────────────────────────────
    function submitAnswers() {
        if (submitted) return;
        submitted = true;

        // Khoá tất cả slot
        document.querySelectorAll('.slot').forEach(s => {
            s.onclick = null;
            s.style.cursor = 'default';
        });

        let correct = 0;
        for (const [slotId, data] of Object.entries(SLOTS)) {
            const el  = document.getElementById(slotId);
            const phId = slotId === 'slot-ao' ? 'ph-ao' : 'ph-od';
            el.classList.remove('answered');
            if (data.answer === data.correct) {
                el.classList.add('correct');
                correct++;
            } else {
                el.classList.add('wrong');
                // Hiện đáp án đúng bên dưới
                document.getElementById(phId).textContent = data.answer + '  ✗';
                // Thêm dòng đáp án đúng (tạo element SVG text thêm vào)
                injectCorrectLabel(slotId, data.correct);
            }
        }

        // Ẩn submit bar
        document.getElementById('btn-submit').style.display = 'none';

        // Hiện banner kết quả
        const banner = document.getElementById('result-banner');
        const title  = document.getElementById('result-title');
        const desc   = document.getElementById('result-desc');
        if (correct === 2) {
            banner.classList.add('all-correct', 'show');
            title.textContent = '🎉 Xuất sắc! Tất cả đúng.';
            desc.textContent  = 'AO = CO · ∠AOD = ∠COB (đối đỉnh) · OD = OB → △AOD = △COB (c.g.c)';
        } else {
            banner.classList.add('has-wrong', 'show');
            title.textContent = `Bạn trả lời đúng ${correct}/2 ô.`;
            desc.textContent  = 'Xem lại các ô được đánh dấu đỏ và đáp án đúng hiển thị bên dưới.';
        }
    }

    // Thêm text "Đáp án: ..." vào ô sai trong SVG
    function injectCorrectLabel(slotId, correctText) {
        const svg   = document.querySelector('.tree-wrap svg');
        const ns    = 'http://www.w3.org/2000/svg';
        const cx    = slotId === 'slot-ao' ? 130 : 610;
        const cy    = 248;
        const txt   = document.createElementNS(ns, 'text');
        txt.setAttribute('x', cx);
        txt.setAttribute('y', cy);
        txt.setAttribute('text-anchor', 'middle');
        txt.setAttribute('font-size', '10');
        txt.setAttribute('fill', '#5fbd18');
        txt.textContent = '→ ' + correctText;
        svg.appendChild(txt);
    }
</script>
</body>
</html>
