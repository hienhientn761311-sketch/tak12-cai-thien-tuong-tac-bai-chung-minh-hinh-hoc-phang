<!DOCTYPE html><html lang="vi"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thi thử – Chứng minh AE·BC = EH·AB</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',sans-serif;background:#0f1117;color:#e8e8f0;padding:36px 20px;display:flex;justify-content:center;min-height:100vh}
.wrap{width:100%;max-width:1160px}

/* badges */
.badge-practice{display:inline-flex;align-items:center;gap:6px;background:rgba(95,189,24,.13);border:1px solid rgba(95,189,24,.4);color:#5fbd18;font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:20px;margin-bottom:10px}
.badge-exam    {display:inline-flex;align-items:center;gap:6px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:#f87171;font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:20px;margin-bottom:10px}
.badge-hard    {display:inline-flex;align-items:center;gap:6px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);color:#fbbf24;font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:20px;margin-bottom:10px}

.header{margin-bottom:18px}
.header h2{font-size:1.3rem;font-weight:700;margin-bottom:4px}
.header p{color:#6b7280;font-size:.84rem}

.given-strip{background:#16181f;border:1px solid #2a2d3a;border-left:3px solid #4f6ef7;border-radius:8px;padding:10px 16px;margin-bottom:18px;font-size:.85rem;color:#a8b3cf;display:flex;gap:10px;align-items:flex-start}
.given-strip .lbl{color:#4f6ef7;font-weight:600;white-space:nowrap;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;padding-top:2px}

/* main layout */
.main-layout{display:flex;gap:18px;align-items:flex-start;margin-bottom:18px}
.fig-panel{flex:0 0 230px;background:#16181f;border:1px solid #2a2d3a;border-radius:12px;padding:16px 10px;display:flex;align-items:center;justify-content:center}
.tree-panel{flex:1;background:#16181f;border:1px solid #2a2d3a;border-radius:12px;padding:20px 14px}
.tree-panel svg{width:100%;display:block}

/* svg static */
.s-box {fill:#1e2130;stroke:#3a3d50;stroke-width:.7}
.s-lbl {fill:#7a85a8;font-size:10px;font-weight:600}
.s-txt {fill:#9ca3af;font-size:10.5px}
.s-given{fill:#16202e;stroke:#2a3a50;stroke-width:.7}
.s-given-lbl{fill:#4f6ef7;font-size:9px;font-weight:600;letter-spacing:.05em}
.s-given-txt{fill:#6b7280;font-size:10px}
.s-top {fill:#1a2a1a;stroke:#5fbd18;stroke-width:1}
.s-top-txt{fill:#5fbd18;font-size:11px;font-weight:700}
.s-mid {fill:#1e1e2a;stroke:#5fbd18;stroke-width:.7}
.s-mid-txt{fill:#a8b3cf;font-size:10.5px}
.conn{stroke:#2a2d3a;stroke-width:.7;fill:none}
.conn-g{stroke:#5fbd18;stroke-width:.7;fill:none}

/* dropzone */
.dz-bg{fill:#1e2130;stroke:#3a3f5a;stroke-width:.7;stroke-dasharray:3 2;transition:fill .15s,stroke .15s}
.dropzone.drag-over .dz-bg{fill:rgba(79,110,247,.13)!important;stroke:#4f6ef7!important;stroke-dasharray:none}
.dropzone.filled    .dz-bg{fill:#1e2130!important;stroke:#52525b!important;stroke-dasharray:none}
.dropzone.correct   .dz-bg{fill:rgba(95,189,24,.11)!important;stroke:#5fbd18!important;stroke-dasharray:none}
.dropzone.wrong     .dz-bg{fill:rgba(239,68,68,.10)!important;stroke:#ef4444!important;stroke-dasharray:none}
.dropzone.shake{animation:shake .38s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.dz-tag{fill:#3a3f5a;font-size:8.5px;font-weight:600;letter-spacing:.05em}
.dz-ph {fill:#40445a;font-size:9.5px;transition:fill .15s}
.dropzone.drag-over .dz-ph{fill:#4f6ef7}
.dropzone.filled    .dz-ph{fill:#c0c8e0;font-size:10.5px}
.dropzone.correct   .dz-ph{fill:#5fbd18;font-size:10.5px}
.dropzone.wrong     .dz-ph{fill:#ef4444;font-size:10.5px}

/* hints */
.hint-area{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.hint-box{display:none;background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.25);border-radius:6px;padding:9px 13px;font-size:.78rem;color:#d4a017;line-height:1.5}
.hint-box.show{display:flex;gap:8px;align-items:flex-start}

/* card bank */
.bank-wrap{background:#16181f;border:1px solid #2a2d3a;border-radius:10px;padding:18px;margin-bottom:16px}
.bank-lbl{font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#40445a;margin-bottom:12px}
.cards{display:flex;flex-wrap:wrap;gap:9px}
.card{background:#1e2130;border:1px solid #2a2d3a;padding:9px 15px;border-radius:7px;cursor:grab;font-size:.84rem;color:#c0c8e0;transition:all .14s;user-select:none}
.card:hover{background:#252838;border-color:#4f6ef7;color:#e8e8f0;transform:translateY(-1px)}
.card:active{cursor:grabbing;transform:scale(.97)}
.card.used{opacity:.28;pointer-events:none}

/* submit */
.submit-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 18px;background:#16181f;border:1px solid #2a2d3a;border-radius:9px;margin-bottom:14px}
.submit-status{font-size:.84rem;color:#6b7280}
.submit-status span{color:#4f6ef7;font-weight:600}
.btn-submit{background:#4f6ef7;border:none;color:#fff;font-weight:700;font-size:.88rem;padding:9px 26px;border-radius:7px;cursor:pointer;font-family:inherit;opacity:.38;pointer-events:none;transition:background .14s,opacity .14s}
.btn-submit.ready{opacity:1;pointer-events:auto}
.btn-submit.ready:hover{background:#3d5ce0}

/* result */
.result-banner{display:none;border-radius:9px;padding:14px 18px;text-align:center;animation:fadeUp .4s ease}
.result-banner.show{display:block}
.result-banner.ok {background:rgba(95,189,24,.1);border:1px solid rgba(95,189,24,.3)}
.result-banner.bad{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25)}
.result-banner p{font-weight:700;font-size:.95rem;margin-bottom:3px}
.result-banner.ok  p{color:#5fbd18}
.result-banner.bad p{color:#f87171}
.result-banner span{font-size:.8rem;color:#6b7280}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
/* Picker */
.picker-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;align-items:center;justify-content:center}
.picker-overlay.open{display:flex}
.picker-box{background:#1e2130;border:1px solid #3a3f5a;border-radius:12px;padding:22px;width:360px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:popIn .17s ease}
@keyframes popIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.picker-title{font-size:.75rem;font-weight:600;color:#6b7280;letter-spacing:.08em;text-transform:uppercase;margin-bottom:13px}
.picker-cards{display:flex;flex-direction:column;gap:8px}
.picker-card{background:#16181f;border:1px solid #2a2d3a;border-radius:7px;padding:10px 15px;cursor:pointer;font-size:.85rem;color:#c0c8e0;transition:all .14s}
.picker-card:hover{background:#252838;border-color:#4f6ef7;color:#e8e8f0}
.picker-cancel{margin-top:11px;width:100%;background:transparent;border:1px solid #2a2d3a;border-radius:7px;padding:8px;color:#52525b;font-size:.8rem;cursor:pointer;transition:all .14s;font-family:inherit}
.picker-cancel:hover{border-color:#3a3f5a;color:#6b7280}
/* Slot clickable */
.slot{cursor:pointer}
.slot:hover .dz-bg{stroke:#6b7280!important}
.slot.selected .dz-bg{fill:rgba(79,110,247,.13)!important;stroke:#4f6ef7!important;stroke-dasharray:none}
.slot.answered .dz-bg{fill:#1e2130!important;stroke:#52525b!important;stroke-dasharray:none}
.slot.answered .dz-ph{fill:#c0c8e0;font-size:10.5px}
.slot.correct  .dz-bg{fill:rgba(95,189,24,.11)!important;stroke:#5fbd18!important;stroke-dasharray:none}
.slot.correct  .dz-ph{fill:#5fbd18;font-size:10.5px}
.slot.wrong    .dz-bg{fill:rgba(239,68,68,.10)!important;stroke:#ef4444!important;stroke-dasharray:none}
.slot.wrong    .dz-ph{fill:#ef4444;font-size:10.5px}
</style></head><body>
<div class="wrap">
  <div class="header">
    <div class="badge-exam">Thi thử</div>
    <h2>Chứng minh: AE · BC = EH · AB</h2>
    <p>Nhấn vào ô trống để chọn mệnh đề. Điền xong cả 4 ô rồi nhấn Nộp bài.</p>
  </div>
  <div class="given-strip">
    <span class="lbl">Giả thiết</span>
    <span>△ABC vuông tại A (AB &lt; AC) nội tiếp đường tròn tâm O, đường kính BC. H ∈ AB (H khác A), đường thẳng qua H ⊥ BC cắt BC tại D và cắt AC tại E.</span>
  </div>

  <div class="main-layout">
    <div class="fig-panel">
      <svg viewBox="0 0 200 200" width="210" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="130" r="72" fill="none" stroke="#2a2d3a" stroke-width="1"/>
        <line x1="28" y1="130" x2="172" y2="130" stroke="#d4d4d8" stroke-width="1.3"/>
        <line x1="28" y1="130" x2="80" y2="58" stroke="#d4d4d8" stroke-width="1.3"/>
        <line x1="80" y1="58" x2="172" y2="130" stroke="#d4d4d8" stroke-width="1.3"/>
        <line x1="55" y1="93" x2="55" y2="130" stroke="#d4d4d8" stroke-width="1.3"/>
        <line x1="55" y1="93" x2="55" y2="38" stroke="#d4d4d8" stroke-width="1.3"/>
        <polyline points="55,121 64,121 64,130" fill="none" stroke="#fbbf24" stroke-width="1"/>
        <polyline points="80,58 86,65 93,60" fill="none" stroke="#fbbf24" stroke-width="1"/>
        <text x="80" y="52" text-anchor="middle" fill="#e4e4e7" font-size="11" font-family="sans-serif">A</text>
        <text x="22" y="134" text-anchor="middle" fill="#e4e4e7" font-size="11" font-family="sans-serif">B</text>
        <text x="178" y="134" text-anchor="middle" fill="#e4e4e7" font-size="11" font-family="sans-serif">C</text>
        <text x="49" y="90" text-anchor="middle" fill="#e4e4e7" font-size="11" font-family="sans-serif">H</text>
        <text x="50" y="137" text-anchor="middle" fill="#e4e4e7" font-size="11" font-family="sans-serif">D</text>
        <text x="48" y="36" text-anchor="middle" fill="#e4e4e7" font-size="11" font-family="sans-serif">E</text>
        <text x="104" y="137" text-anchor="middle" fill="#6b7280" font-size="10" font-family="sans-serif">O</text>
        <circle cx="100" cy="130" r="2" fill="#6b7280"/>
      </svg>
    </div>

    <div class="tree-panel">
      <svg viewBox="0 0 780 410">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="#3a3f5a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
          <marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="#5fbd18" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
        </defs>
        <!-- All connectors always visible -->
        <line x1="390" y1="68" x2="390" y2="50" class="conn-g" marker-end="url(#arg)"/>
        <line x1="390" y1="126" x2="390" y2="106" class="conn" marker-end="url(#ar)"/>
        <line x1="135" y1="190" x2="355" y2="166" class="conn" marker-end="url(#ar)"/>
        <line x1="500" y1="190" x2="425" y2="166" class="conn" marker-end="url(#ar)"/>
        <line x1="150" y1="268" x2="460" y2="234" class="conn" marker-end="url(#ar)"/>
        <line x1="610" y1="268" x2="540" y2="234" class="conn" marker-end="url(#ar)"/>
        <line x1="104" y1="346" x2="110" y2="312" class="conn" marker-end="url(#ar)"/>
        <line x1="292" y1="346" x2="180" y2="312" class="conn" marker-end="url(#ar)"/>
        <line x1="624" y1="346" x2="610" y2="312" class="conn" marker-end="url(#ar)"/>

        <!-- TOP -->
        <rect x="220" y="8" width="340" height="42" rx="6" class="s-top"/>
        <text x="390" y="25" text-anchor="middle" class="s-top-txt">AE · BC = EH · AB</text>
        <text x="390" y="41" text-anchor="middle" style="fill:#4b7a14;font-size:10px">Cần chứng minh</text>
        <!-- ROW1 -->
        <rect x="250" y="68" width="280" height="38" rx="5" class="s-mid"/>
        <text x="390" y="83" text-anchor="middle" class="s-mid-txt">AE / AB = EH / BC</text>
        <text x="390" y="98" text-anchor="middle" style="fill:#6b7280;font-size:9px">(tích chéo)</text>
        <!-- Slot (4) -->
        <g id="sl-s4" class="slot" onclick="openPicker('sl-s4','s4')">
          <rect class="dz-bg" x="310" y="126" width="160" height="40" rx="5"/>
          <text class="dz-tag" x="321" y="140">(4)</text>
          <text class="dz-ph" id="ph-s4" x="390" y="152" text-anchor="middle">Nhấn để chọn…</text>
        </g>
        <!-- ROW3 left static -->
        <rect x="20" y="190" width="230" height="44" rx="5" class="s-box"/>
        <text x="135" y="208" text-anchor="middle" class="s-lbl">Góc bằng nhau</text>
        <text x="135" y="225" text-anchor="middle" class="s-txt">∠EAH = ∠CAB = 90°</text>
        <!-- Slot (3) -->
        <g id="sl-s3" class="slot" onclick="openPicker('sl-s3','s3')">
          <rect class="dz-bg" x="420" y="190" width="160" height="44" rx="5"/>
          <text class="dz-tag" x="431" y="205">(3)</text>
          <text class="dz-ph" id="ph-s3" x="500" y="218" text-anchor="middle">Nhấn để chọn…</text>
        </g>
        <!-- Slot (1) -->
        <g id="sl-s1" class="slot" onclick="openPicker('sl-s1','s1')">
          <rect class="dz-bg" x="60" y="268" width="180" height="44" rx="5"/>
          <text class="dz-tag" x="71" y="283">(1)</text>
          <text class="dz-ph" id="ph-s1" x="150" y="296" text-anchor="middle">Nhấn để chọn…</text>
        </g>
        <!-- Slot (2) -->
        <g id="sl-s2" class="slot" onclick="openPicker('sl-s2','s2')">
          <rect class="dz-bg" x="520" y="268" width="180" height="44" rx="5"/>
          <text class="dz-tag" x="531" y="283">(2)</text>
          <text class="dz-ph" id="ph-s2" x="610" y="296" text-anchor="middle">Nhấn để chọn…</text>
        </g>
        <!-- ROW5 static givens -->
        <rect x="10" y="346" width="188" height="52" rx="5" class="s-given"/>
        <text x="104" y="363" text-anchor="middle" class="s-given-lbl">Góc đối đỉnh</text>
        <text x="104" y="379" text-anchor="middle" class="s-given-txt">∠AHE = ∠BHD</text>
        <rect x="208" y="346" width="168" height="52" rx="5" class="s-given"/>
        <text x="292" y="363" text-anchor="middle" class="s-given-lbl">Vuông tại D</text>
        <text x="292" y="379" text-anchor="middle" class="s-given-txt">△HBD vuông tại D</text>
        <rect x="530" y="346" width="188" height="52" rx="5" class="s-given"/>
        <text x="624" y="363" text-anchor="middle" class="s-given-lbl">Vuông tại A</text>
        <text x="624" y="379" text-anchor="middle" class="s-given-txt">△ABC vuông tại A</text>
      </svg>
    </div>
  </div>

  <div class="submit-bar">
    <p class="submit-status">Đã điền: <span id="fc">0</span> / 4 ô</p>
    <button class="btn-submit" id="btn-sub" onclick="doSubmit()">Nộp bài</button>
  </div>
  <div class="result-banner" id="res-banner"><p id="res-title"></p><span id="res-desc"></span></div>
</div>

<!-- Picker -->
<div class="picker-overlay" id="picker-ov" onclick="closePOv(event)">
  <div class="picker-box">
    <p class="picker-title" id="picker-ttl">Chọn mệnh đề</p>
    <div class="picker-cards" id="picker-cards"></div>
    <button class="picker-cancel" onclick="closePicker()">Huỷ</button>
  </div>
</div>

<script>
const CORRECT={s1:'∠AHE + ∠HBD = 90°',s2:'∠ACB + ∠HBD = 90°',s3:'∠AHE = ∠ACB',s4:'△EAH ~ △BAC (g.g)'};
const BANK={
  s1:['∠AHE + ∠HBD = 90°','△AHE ~ △BHD (c.c.c)','△AHE = △BHD','∠HAE = ∠HBD'],
  s2:['∠ACB + ∠HBD = 90°','∠HBD + ∠BAC = 90°','∠ABD + ∠HBD = 90°','∠HBD + ∠ABC = 90°'],
  s3:['∠AHE = ∠ACB','∠HAE = ∠BAC','∠EAH = ∠ACB','∠AEH = ∠ACB'],
  s4:['△EAH ~ △BAC (g.g)','△EAH ~ △BAC (c.g.c)','△EAH = △BAC','△AEH ~ △BAC (g.g)'],
};
const answers={s1:null,s2:null,s3:null,s4:null};
let curSlot=null, curSid=null, submitted=false;

function openPicker(slotId,sid){
  if(submitted) return;
  curSlot=slotId; curSid=sid;
  document.querySelectorAll('.slot').forEach(s=>s.classList.remove('selected'));
  const el=document.getElementById(slotId);
  if(!el.classList.contains('answered')) el.classList.add('selected');
  const cards=[...BANK[sid]].sort(()=>Math.random()-.5);
  const cont=document.getElementById('picker-cards'); cont.innerHTML='';
  cards.forEach(txt=>{
    const d=document.createElement('div'); d.className='picker-card'; d.textContent=txt;
    d.onclick=()=>selectCard(txt); cont.appendChild(d);
  });
  document.getElementById('picker-ttl').textContent='Chọn mệnh đề cho ô ('+sid.replace('s','')+')';
  document.getElementById('picker-ov').classList.add('open');
}
function selectCard(val){
  answers[curSid]=val;
  document.getElementById('ph-'+curSid).textContent=val;
  const el=document.getElementById(curSlot);
  el.classList.remove('selected'); el.classList.add('answered');
  closePicker(); updateBar();
}
function closePicker(){ document.getElementById('picker-ov').classList.remove('open'); document.querySelectorAll('.slot').forEach(s=>s.classList.remove('selected')); curSlot=curSid=null; }
function closePOv(e){ if(e.target===document.getElementById('picker-ov')) closePicker(); }
function updateBar(){
  const n=Object.values(answers).filter(v=>v!==null).length;
  document.getElementById('fc').textContent=n;
  document.getElementById('btn-sub').classList.toggle('ready',n===4);
}
function doSubmit(){
  if(submitted) return; submitted=true;
  document.querySelectorAll('.slot').forEach(s=>{ s.onclick=null; s.style.cursor='default'; });
  let ok=0;
  for(const [sid,val] of Object.entries(answers)){
    const slId='sl-'+sid; const el=document.getElementById(slId);
    el.classList.remove('answered');
    if(val===CORRECT[sid]){ el.classList.add('correct'); ok++; }
    else{
      el.classList.add('wrong');
      document.getElementById('ph-'+sid).textContent=(val||'(chưa điền)')+' ✗';
      injectOk(slId,sid,CORRECT[sid]);
    }
  }
  document.getElementById('btn-sub').style.display='none';
  const b=document.getElementById('res-banner');
  document.getElementById('res-title').textContent=ok===4?'🎉 Xuất sắc! Tất cả đúng.':'Bạn trả lời đúng '+ok+'/4 ô.';
  document.getElementById('res-desc').textContent=ok===4?'Sơ đồ chứng minh hoàn chỉnh và logic.':'Xem các ô đỏ và đáp án đúng bên dưới.';
  b.classList.add(ok===4?'ok':'bad','show');
}
function injectOk(slId,sid,txt){
  const svg=document.querySelector('.tree-panel svg');
  const cx={s1:150,s2:610,s3:500,s4:390}[sid];
  const cy={s1:308,s2:308,s3:234,s4:172}[sid];
  const ns='http://www.w3.org/2000/svg';
  const t=document.createElementNS(ns,'text');
  t.setAttribute('x',cx); t.setAttribute('y',cy);
  t.setAttribute('text-anchor','middle'); t.setAttribute('font-size','9');
  t.setAttribute('fill','#5fbd18'); t.textContent='→ '+txt;
  svg.appendChild(t);
}
</script>
</body></html>
