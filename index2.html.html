<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thi thử Nâng cao: △AOD = △COB - TAK12</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #0f1117;
            color: #e8e8f0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .widget-container { width: 100%; max-width: 1100px; }

        /* Header */
        .badge-exam {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.35);
            color: #f87171;
            font-size: 0.7rem; font-weight: 700;
            letter-spacing: .1em; text-transform: uppercase;
            padding: 5px 12px; border-radius: 20px;
            margin-bottom: 12px;
        }
        .badge-exam::before { content: '●'; font-size: 8px; }
        .header { margin-bottom: 20px; }
        .header h2 { font-size: 1.35rem; font-weight: 700; margin-bottom: 4px; }
        .header p  { color: #6b7280; font-size: .85rem; }

        .given-strip {
            background: #16181f;
            border: 1px solid #2a2d3a;
            border-left: 3px solid #4f6ef7;
            border-radius: 8px;
            padding: 11px 18px; margin-bottom: 20px;
            font-size: .875rem; color: #a8b3cf;
            display: flex; gap: 10px; align-items: flex-start;
        }
        .given-strip .lbl {
            color: #4f6ef7; font-weight: 600; white-space: nowrap;
            font-size: .72rem; text-transform: uppercase;
            letter-spacing: .08em; padding-top: 2px;
        }

        /* Layout */
        .main-layout {
            display: flex; gap: 20px; align-items: flex-start; margin-bottom: 20px;
        }
        .figure-panel {
            flex: 0 0 240px;
            background: #16181f; border: 1px solid #2a2d3a;
            border-radius: 12px; padding: 16px 12px;
            display: flex; flex-direction: column; align-items: center;
        }
        .figure-svg { width: 100%; max-width: 210px; }
        .tree-wrap {
            flex: 1; background: #16181f;
            border: 1px solid #2a2d3a; border-radius: 12px;
            padding: 24px 16px 20px;
        }
        .tree-wrap svg { width: 100%; display: block; }

        /* SVG elements */
        .static-rect { fill: #1e2130; stroke: #2a2d3a; stroke-width: .8; }
        .static-lbl  { fill: #52c41a; font-size: 9.5px; font-weight: 600; }
        .static-txt  { fill: #7a85a8; font-size: 11px; }
        .concl-rect  { fill: #1a2a1a; stroke: #5fbd18; stroke-width: 1; }
        .concl-txt   { fill: #5fbd18; font-size: 13px; font-weight: 600; }
        .conn-green  { stroke: #5fbd18; stroke-width: .8; fill: none; }

        /* Dropzone slots */
        .slot-bg {
            fill: #1e2130; stroke: #3a3f5a; stroke-width: .8;
            stroke-dasharray: 4 3; transition: fill .15s, stroke .15s;
        }
        .dropzone.drag-over .slot-bg { fill: rgba(79,110,247,0.14) !important; stroke: #4f6ef7 !important; stroke-dasharray: none; }
        .dropzone.filled   .slot-bg  { fill: #1e2130 !important; stroke: #52525b !important; stroke-dasharray: none; }
        .dropzone.correct  .slot-bg  { fill: rgba(95,189,24,0.12) !important; stroke: #5fbd18 !important; stroke-dasharray: none; }
        .dropzone.wrong    .slot-bg  { fill: rgba(239,68,68,0.10) !important; stroke: #ef4444 !important; stroke-dasharray: none; }
        .dropzone.shake { animation: shake .38s ease; }
        @keyframes shake {
            0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)}
            40%{transform:translateX(5px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)}
        }

        .slot-tag { fill: #3a3f5a; font-size: 9.5px; font-weight: 600; letter-spacing: .06em; }
        .slot-ph  { fill: #40445a; font-size: 10.5px; transition: fill .15s; }
        .dropzone.drag-over .slot-ph { fill: #4f6ef7; }
        .dropzone.filled    .slot-ph { fill: #c0c8e0; font-size: 11.5px; }
        .dropzone.correct   .slot-ph { fill: #5fbd18; font-size: 11.5px; }
        .dropzone.wrong     .slot-ph { fill: #ef4444; font-size: 11.5px; }

        /* Card bank */
        .bank-wrap {
            background: #16181f; border: 1px solid #2a2d3a;
            border-radius: 12px; padding: 20px 20px 18px;
            margin-bottom: 20px;
        }
        .bank-label {
            font-size: .7rem; font-weight: 600; letter-spacing: .1em;
            text-transform: uppercase; color: #40445a; margin-bottom: 14px;
        }
        .cards { display: flex; flex-wrap: wrap; gap: 10px; }
        .draggable-card {
            background: #1e2130; border: 1px solid #2a2d3a;
            padding: 10px 18px; border-radius: 7px;
            cursor: grab; font-size: .88rem; color: #c0c8e0;
            transition: all .15s; user-select: none;
        }
        .draggable-card:hover { background: #252838; border-color: #4f6ef7; color: #e8e8f0; transform: translateY(-1px); }
        .draggable-card:active { cursor: grabbing; transform: scale(.97); }
        .draggable-card.used { opacity: .3; pointer-events: none; }

        /* Submit bar */
        .submit-bar {
            display: flex; align-items: center; justify-content: space-between;
            gap: 16px; padding: 14px 20px;
            background: #16181f; border: 1px solid #2a2d3a;
            border-radius: 10px; margin-bottom: 16px;
        }
        .submit-status { font-size: .875rem; color: #6b7280; }
        .submit-status span { color: #4f6ef7; font-weight: 600; }
        .btn-submit {
            background: #4f6ef7; border: none;
            color: #fff; font-weight: 700; font-size: .9rem;
            padding: 10px 28px; border-radius: 7px;
            cursor: pointer; font-family: inherit;
            transition: background .15s, opacity .15s;
            opacity: .4; pointer-events: none;
        }
        .btn-submit.ready { opacity: 1; pointer-events: auto; }
        .btn-submit.ready:hover { background: #3d5ce0; }

        /* Result */
        .result-banner {
            display: none; border-radius: 10px;
            padding: 16px 20px; text-align: center;
            animation: fadeIn .4s ease;
        }
        .result-banner.show { display: block; }
        .result-banner.all-correct { background: rgba(95,189,24,0.1); border: 1px solid rgba(95,189,24,0.3); }
        .result-banner.has-wrong   { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); }
        .result-banner p { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
        .result-banner.all-correct p { color: #5fbd18; }
        .result-banner.has-wrong   p { color: #f87171; }
        .result-banner span { font-size: .82rem; color: #6b7280; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }

        @media (max-width: 680px) {
            .main-layout { flex-direction: column; }
            .figure-panel { flex: none; width: 100%; }
        }
    </style>
</head>
<body>
<div class="widget-container">

    <div class="header">
        <div class="badge-exam">Thi thử · Nâng cao</div>
        <h2>Chứng minh: △AOD = △COB</h2>
        <p>Kéo mệnh đề từ ngân hàng vào đúng ô. Điền xong tất cả rồi nhấn Nộp bài.</p>
    </div>

    <div class="given-strip">
        <span class="lbl">Giả thiết</span>
        <span>Cho hình vẽ, O là giao điểm của AC và BD. Biết AO = CO, OD = OB. Chứng minh △AOD = △COB.</span>
    </div>

    <div class="main-layout">

        <!-- Hình vẽ -->
        <div class="figure-panel">
            <svg class="figure-svg" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
                <line x1="60"  y1="30"  x2="160" y2="190" stroke="#d4d4d8" stroke-width="1.5"/>
                <line x1="190" y1="40"  x2="28"  y2="178" stroke="#d4d4d8" stroke-width="1.5"/>
                <line x1="60"  y1="30"  x2="28"  y2="178" stroke="#d4d4d8" stroke-width="1.5"/>
                <line x1="160" y1="190" x2="190" y2="40"  stroke="#d4d4d8" stroke-width="1.5"/>
                <text x="55"  y="22"  text-anchor="middle" fill="#e4e4e7" font-size="13" font-family="sans-serif">A</text>
                <text x="200" y="38"  text-anchor="middle" fill="#e4e4e7" font-size="13" font-family="sans-serif">B</text>
                <text x="165" y="204" text-anchor="middle" fill="#e4e4e7" font-size="13" font-family="sans-serif">C</text>
                <text x="20"  y="185" text-anchor="middle" fill="#e4e4e7" font-size="13" font-family="sans-serif">D</text>
                <text x="103" y="104" text-anchor="end"    fill="#e4e4e7" font-size="12" font-family="sans-serif">O</text>
                <line x1="80"  y1="72"  x2="88"  y2="66"  stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
                <line x1="130" y1="152" x2="138" y2="146" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
                <line x1="65"  y1="141" x2="71"  y2="148" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
                <line x1="61"  y1="137" x2="67"  y2="144" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
                <line x1="147" y1="71"  x2="153" y2="78"  stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
                <line x1="143" y1="67"  x2="149" y2="74"  stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
                <circle cx="109" cy="109" r="2.5" fill="#d4d4d8"/>
            </svg>
        </div>

        <!-- Sơ đồ -->
        <div class="tree-wrap">
            <svg viewBox="0 0 740 310">
                <defs>
                    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                        <path d="M2 1L8 5L2 9" fill="none" stroke="#5fbd18" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </marker>
                </defs>

                <!-- Mũi tên hội tụ (luôn hiện) -->
                <line x1="130" y1="198" x2="295" y2="138" class="conn-green" marker-end="url(#arr-g)"/>
                <line x1="370" y1="198" x2="370" y2="138" class="conn-green" marker-end="url(#arr-g)"/>
                <line x1="610" y1="198" x2="445" y2="138" class="conn-green" marker-end="url(#arr-g)"/>

                <!-- Kết luận (luôn hiện) -->
                <rect x="160" y="60" width="420" height="62" rx="8" class="concl-rect"/>
                <text x="370" y="86"  text-anchor="middle" class="concl-txt">△AOD = △COB (c.g.c)</text>
                <text x="370" y="108" text-anchor="middle" style="fill:#4b7a14;font-size:11px;">Cần chứng minh</text>

                <!-- Slot TRÁI -->
                <g id="dz-ao" class="dropzone"
                   ondragover="onOver(event,'dz-ao')" ondragleave="onLeave('dz-ao')"
                   ondrop="onDrop(event,'dz-ao')">
                    <rect class="slot-bg" x="30" y="198" width="200" height="60" rx="6"/>
                    <text class="slot-tag" x="42"  y="216">BƯỚC 1</text>
                    <text class="slot-ph"  id="ph-ao" x="130" y="234" text-anchor="middle">Kéo mệnh đề vào đây…</text>
                </g>

                <!-- Ô giữa tĩnh -->
                <rect x="270" y="198" width="200" height="60" rx="6" class="static-rect"/>
                <text x="370" y="217" text-anchor="middle" class="static-lbl">Góc đối đỉnh</text>
                <text x="370" y="238" text-anchor="middle" class="static-txt">∠AOD = ∠COB</text>

                <!-- Slot PHẢI -->
                <g id="dz-od" class="dropzone"
                   ondragover="onOver(event,'dz-od')" ondragleave="onLeave('dz-od')"
                   ondrop="onDrop(event,'dz-od')">
                    <rect class="slot-bg" x="510" y="198" width="200" height="60" rx="6"/>
                    <text class="slot-tag" x="522" y="216">BƯỚC 2</text>
                    <text class="slot-ph"  id="ph-od" x="610" y="234" text-anchor="middle">Kéo mệnh đề vào đây…</text>
                </g>

            </svg>
        </div>
    </div>

    <!-- Ngân hàng chung -->
    <div class="bank-wrap">
        <p class="bank-label">Ngân hàng mệnh đề — kéo vào ô phù hợp</p>
        <div class="cards" id="card-pool"></div>
    </div>

    <!-- Submit -->
    <div class="submit-bar">
        <p class="submit-status">Đã điền: <span id="filled-count">0</span> / 2 ô</p>
        <button class="btn-submit" id="btn-submit" onclick="submitAnswers()">Nộp bài</button>
    </div>

    <div class="result-banner" id="result-banner">
        <p id="result-title"></p>
        <span id="result-desc"></span>
    </div>

</div>

<script>
    // ── Config ────────────────────────────────────────────────────
    const CORRECT = { 'dz-ao': 'AO = CO', 'dz-od': 'OD = OB' };
    const PH_ID   = { 'dz-ao': 'ph-ao',   'dz-od': 'ph-od'   };

    // Ngân hàng chung — tất cả thẻ của cả 2 ô, xáo trộn
    const ALL_CARDS = ['AO = CO', 'OD = OB', 'AO = OB', '∠OAD = ∠OCB', 'CO = OB', '∠AOD = ∠COB'];

    // State
    const answers  = { 'dz-ao': null, 'dz-od': null };
    // track which card is currently filling which slot (for swap-back)
    const slotCard = { 'dz-ao': null, 'dz-od': null };
    let submitted  = false;

    // ── Build card pool ───────────────────────────────────────────
    function buildPool() {
        const pool = document.getElementById('card-pool');
        const shuffled = [...ALL_CARDS].sort(() => Math.random() - .5);
        shuffled.forEach(text => {
            const div = document.createElement('div');
            div.className = 'draggable-card';
            div.id = 'card-' + text.replace(/[^a-zA-Z0-9]/g, '_');
            div.draggable = true;
            div.textContent = text;
            div.addEventListener('dragstart', e => {
                e.dataTransfer.setData('text', text);
                e.dataTransfer.setData('cardId', div.id);
            });
            pool.appendChild(div);
        });
    }
    buildPool();

    // ── Drag handlers ─────────────────────────────────────────────
    function onOver(e, id) {
        e.preventDefault();
        const el = document.getElementById(id);
        if (!submitted) el.classList.add('drag-over');
    }
    function onLeave(id) {
        document.getElementById(id).classList.remove('drag-over');
    }

    function onDrop(e, zoneId) {
        e.preventDefault();
        if (submitted) return;
        const zone   = document.getElementById(zoneId);
        zone.classList.remove('drag-over');

        const value  = e.dataTransfer.getData('text');
        const cardId = e.dataTransfer.getData('cardId');

        // Nếu thẻ này đang nằm ở slot khác → trả thẻ cũ về pool
        for (const [sid, val] of Object.entries(answers)) {
            if (val === value && sid !== zoneId) {
                clearSlot(sid);
            }
        }

        // Nếu slot này đã có thẻ → trả thẻ cũ về pool
        if (answers[zoneId] !== null) {
            restoreCard(answers[zoneId]);
        }

        // Điền thẻ mới vào slot
        answers[zoneId] = value;
        slotCard[zoneId] = cardId;
        document.getElementById(PH_ID[zoneId]).textContent = value;
        zone.classList.add('filled');

        // Ẩn thẻ khỏi pool
        const cardEl = document.getElementById(cardId);
        if (cardEl) cardEl.classList.add('used');

        updateBar();
    }

    function clearSlot(zoneId) {
        restoreCard(answers[zoneId]);
        answers[zoneId]  = null;
        slotCard[zoneId] = null;
        document.getElementById(PH_ID[zoneId]).textContent = 'Kéo mệnh đề vào đây…';
        const zone = document.getElementById(zoneId);
        zone.classList.remove('filled');
    }

    function restoreCard(value) {
        if (!value) return;
        const id = 'card-' + value.replace(/[^a-zA-Z0-9]/g, '_');
        const el = document.getElementById(id);
        if (el) el.classList.remove('used');
    }

    // ── Submit bar ────────────────────────────────────────────────
    function updateBar() {
        const filled = Object.values(answers).filter(v => v !== null).length;
        document.getElementById('filled-count').textContent = filled;
        const btn = document.getElementById('btn-submit');
        btn.classList.toggle('ready', filled === 2);
    }

    // ── Submit ────────────────────────────────────────────────────
    function submitAnswers() {
        if (submitted) return;
        submitted = true;

        // Khoá kéo thả
        document.querySelectorAll('.dropzone').forEach(el => {
            el.removeAttribute('ondragover');
            el.removeAttribute('ondragleave');
            el.removeAttribute('ondrop');
        });
        document.querySelectorAll('.draggable-card').forEach(el => {
            el.draggable = false;
            el.style.cursor = 'default';
        });

        let correct = 0;
        for (const [zoneId, val] of Object.entries(answers)) {
            const zone = document.getElementById(zoneId);
            zone.classList.remove('filled');
            if (val === CORRECT[zoneId]) {
                zone.classList.add('correct');
                correct++;
            } else {
                zone.classList.add('wrong');
                // Hiện đáp án đúng
                injectCorrect(zoneId, CORRECT[zoneId]);
            }
        }

        document.getElementById('btn-submit').style.display = 'none';

        const banner = document.getElementById('result-banner');
        document.getElementById('result-title').textContent =
            correct === 2 ? '🎉 Xuất sắc! Tất cả đúng.' : `Bạn trả lời đúng ${correct}/2 ô.`;
        document.getElementById('result-desc').textContent =
            correct === 2
                ? 'AO = CO · ∠AOD = ∠COB (đối đỉnh) · OD = OB → △AOD = △COB (c.g.c)'
                : 'Xem lại ô đỏ và đáp án đúng hiển thị bên dưới.';
        banner.classList.add(correct === 2 ? 'all-correct' : 'has-wrong', 'show');
    }

    function injectCorrect(zoneId, correctText) {
        const svg = document.querySelector('.tree-wrap svg');
        const ns  = 'http://www.w3.org/2000/svg';
        const cx  = zoneId === 'dz-ao' ? 130 : 610;
        const t   = document.createElementNS(ns, 'text');
        t.setAttribute('x', cx);
        t.setAttribute('y', 251);
        t.setAttribute('text-anchor', 'middle');
        t.setAttribute('font-size', '10');
        t.setAttribute('fill', '#5fbd18');
        t.textContent = '→ ' + correctText;
        svg.appendChild(t);
    }
</script>
</body>
</html>
